        sensitivity_transport_limits: true

  Reg4Fuels_V23_net_import_limits_winter:
    settings:
      scenario:
        sensitivity_transport_limits: true 

  Reg4Fuels_V23_net_survival:
    settings:
      scenario:
        sensitivity_net_survival: true

  Reg4Fuels_V23_net_survival_winter:
    settings:
      scenario:
        sensitivity_net_survival: true
