  Reg4Fuels_V23_time_matching_annual:
    settings:
      calibration:
        use_renewable_credits: true
      structure:
        set_carriers:
          - renewable_energy_credit
        set_storage_technologies:
          - renewable_energy_credit_storage

  Reg4Fuels_V23_time_matching_exact:
    settings:
      calibration:
        use_renewable_credits: true
      structure:
        set_carriers:
